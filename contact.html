  <meta charset="utf-8">

  <title>Contact — Lucía Tapia</title>
  <meta name="description" content="Get in touch with Lucía Tapia García, a creative based in Boston working across branding, advertising, illustration and art direction.">
  <link rel="preload" href="assets/fonts/zt-bros-oskon.woff2" as="font" type="font/woff2" crossorigin>

<body class="page-contact">

  <header class="nav" data-nav>
    <a class="nav__logo" href="index.html" aria-label="Lucía Tapia — home"><span class="logo-mark"></span></a>
    <nav class="nav__links" aria-label="Main">
      <a href="work.html" data-i18n="nav.work">Work</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="archive.html" data-i18n="nav.archive">Archive</a>
      <a href="contact.html" data-i18n="nav.contact" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="contact wrap" id="top">
    <div class="contact__grid">
      <div class="contact__intro">
        <div class="contact__text">
          <h1 class="contact__title" data-i18n-html="contact.title"><span class="ln"><span class="cap">G</span>et in touch</span></h1>
          <p class="contact__lead" data-i18n="contact.lead">Whether it’s a project, a collaboration or just a&nbsp;chat, I’d love to hear from you&nbsp;:)</p>
        </div>
        <img class="contact__chickens" src="assets/img/chickens.webp" alt="Illustration of Lucía sitting cross-legged, hugging a chicken, with three more chickens around her" width="1400" height="1153" data-chickens>
      </div>

      <div class="contact__formwrap">
        <!-- To receive messages straight to your inbox, paste a form endpoint (e.g. Formspree) into data-endpoint.
             Until then, "Send" opens the visitor's email app with the message already written. -->
        <form class="contact__form" data-contact data-endpoint="" novalidate>
          <label class="field">
            <span class="sr-only" data-i18n="contact.name">Name</span>
            <input type="text" name="name" autocomplete="name" required placeholder="Name" data-i18n-ph="contact.name">
          </label>
          <label class="field">
            <span class="sr-only" data-i18n="contact.email">Email</span>
            <input type="email" name="email" autocomplete="email" required placeholder="Email" data-i18n-ph="contact.email">
          </label>
          <label class="field field--msg">
            <span class="sr-only" data-i18n="contact.message">Message</span>
            <textarea name="message" rows="5" required placeholder="Message" data-i18n-ph="contact.message"></textarea>
          </label>
          <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="contact__actions">
            <button type="submit" class="btn contact__send"><span data-i18n="contact.send">Send message</span> <span aria-hidden="true">→</span></button>
            <p class="contact__note" data-contact-note role="status" aria-live="polite"></p>
          </div>
        </form>
        <div class="contact__thanks" data-contact-thanks hidden>
          <p class="contact__thanksTitle" data-i18n="contact.thanksTitle">Thank you!</p>
          <p data-i18n="contact.thanksLine">Your message is on its way. I’ll get back to you soon.</p>
          <button type="button" class="contact__again" data-contact-again data-i18n="contact.again">Send another</button>
        </div>
      </div>
    </div>

  </main>

  <footer class="footer wrap">
    <ul class="footer__links">
      <li><a href="mailto:luciatapiaag@gmail.com">Email</a></li>
      <li><a href="https://www.linkedin.com/in/luc%C3%ADa-tapia-garc%C3%ADa-0a97b5249/" target="_blank" rel="noopener">LinkedIn ↗</a></li>
      <li><a href="https://www.instagram.com/by.luciatapia/" target="_blank" rel="noopener">Instagram ↗</a></li>
      <li>© 2026, Lucía Tapia García</li>
    </ul>
    <button type="button" class="to-top" data-to-top aria-label="Back to top"><span aria-hidden="true">↑</span> <span data-i18n="footer.top">top</span></button>
  </footer>

  <script src="assets/js/main.js?v=09291745"></script>
</body>
</html>
